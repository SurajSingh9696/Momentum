# Render deployment configuration
# Single service: builds the React frontend then serves it via the Express backend.

services:
  - type: web
    name: momentum-backend
    env: node
    region: oregon
    plan: free
    # rootDir intentionally omitted — we run from workspace root so we can
    # build the frontend (dist/) and then start backend/server.js.
    buildCommand: npm install && npm run build && cd backend && npm install
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false   # Set this in Render dashboard
      - key: JWT_SECRET
        sync: false   # Set this in Render dashboard
      - key: CLIENT_ORIGIN
        sync: false   # Optional — leave blank when frontend is served by same service
      - key: PORT
        value: 10000  # Render uses port 10000 by default
