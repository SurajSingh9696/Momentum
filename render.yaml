# Render deployment configuration
# Deploy settings for the backend service on Render

services:
  - type: web
    name: momentum-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false   # Set this in Render dashboard
      - key: JWT_SECRET
        sync: false   # Set this in Render dashboard
      - key: CLIENT_ORIGIN
        sync: false   # Set to your Vercel frontend URL, e.g. https://momentum-app.vercel.app
      - key: PORT
        value: 10000  # Render uses port 10000 by default
